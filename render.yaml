services:
  # ── Backend Web Service (Render) ──
  # NOTE: Static sites (trader-app, admin-panel, landing) are hosted on
  # Cloudflare Pages for unlimited bandwidth. Only the backend API runs on Render.
  - type: web
    name: stockslab-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # ── CORS Origins (Cloudflare Pages URLs) ──
      # Update these after deploying frontends on Cloudflare Pages
      - key: FRONTEND_URL
        value: https://stockslab-app.pages.dev
      - key: ADMIN_URL
        value: https://stockslab-admin.pages.dev
      - key: LANDING_URL
        value: https://stockslab-landing.pages.dev
      - key: REDIS_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Static Sites moved to Cloudflare Pages ──
  # Trader App:   Deploy on Cloudflare Pages (root: apps/trader-app, build: npm run build, output: dist)
  # Admin Panel:  Deploy on Cloudflare Pages (root: apps/admin-panel, build: npm run build, output: dist)
  # Landing Page: Deploy on Cloudflare Pages (root: apps/landing, build: npm run build, output: dist)
  # See DEPLOYMENT.md for setup instructions.
